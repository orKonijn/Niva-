<header
  class="site-container w-[min(1240px,_calc(100%_-_88px))] mx-auto max-[1200px]:w-[calc(100%_-_56px)] max-[768px]:w-[calc(100%_-_40px)] simple-header flex justify-between items-center py-[33px] max-[768px]:py-[27px]"
>
  <niva-brand /><a
    routerLink="/"
    class="text-link inline-flex items-center font-medium text-brand min-h-[36px] hover:text-brand-strong"
    >בחזרה לאתר</a
  >
</header>
<main
  id="main"
  tabindex="-1"
  class="legal-page max-w-[830px] py-[50px_90px] max-[768px]:py-[35px_130px] site-container w-[min(1240px,_calc(100%_-_88px))] mx-auto max-[1200px]:w-[calc(100%_-_56px)] max-[768px]:w-[calc(100%_-_40px)]"
>
  <span class="section-kicker block font-semibold text-brand tracking-[0.02em]"
    >Niva · גרסת פיתוח</span
  >
  <h1>{{ title }}</h1>
  @for (section of sections; track section.h) {
    <section>
      <h2>{{ section.h }}</h2>
      <p>{{ section.p }}</p>
    </section>
  }
  <a
    routerLink="/app/profile"
    class="button inline-flex items-center gap-[13px] rounded-[12px] font-semibold leading-[1.5] button-outline bg-surface text-ink border-line enabled:hover:bg-pale"
    >לניהול נתוני ההדגמה</a
  >
</main>

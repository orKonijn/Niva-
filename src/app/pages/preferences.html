<niva-page-heading
  kicker="לפי מה שחשוב לך"
  heading="מדייקים את הכיוון"
  description="העדפות טובות עוזרות לגלות הזדמנויות נכונות יותר."
>
</niva-page-heading>
<form
  class="panel bg-surface rounded-[20px] p-[32px] max-[768px]:p-[24px_20px] max-[768px]:rounded-[16px] narrow-panel max-w-[800px]"
  (ngSubmit)="save()"
>
  <div class="panel-heading flex items-center gap-[15px]">
    <span class="round-icon items-center justify-center shrink-[0] blue"
      ><niva-icon name="settings"
    /></span>
    <div>
      <h2>העדפות החיפוש שלך</h2>
      <p>הבחירות נשמרות רק בדפדפן הזה.</p>
    </div>
  </div>
  <niva-preference-fields [value]="draft" (valueChange)="draft = $event; saved.set(false)" />
  <div class="form-actions flex items-center gap-[22px] flex-wrap max-[768px]:gap-[16px]">
    <button
      class="button inline-flex items-center gap-[13px] rounded-[12px] bg-action text-on-action font-semibold leading-[1.5] enabled:hover:bg-action-hover"
      type="submit"
    >
      שמירת ההעדפות <niva-icon name="check" />
    </button>
    @if (saved()) {
      <span class="success-text text-success text-[12px]" role="status"
        >ההעדפות נשמרו. {{ store.eligibleJobs().length }} משרות לדוגמה מתאימות כעת.</span
      >
    }
  </div>
</form>

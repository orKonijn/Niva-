<niva-page-heading
  kicker="לפי מה שחשוב לך"
  heading="מה חשוב לך בעבודה הבאה?"
  description="בוחרים תחום, מחוז ואופן עבודה כדי לצמצם את רשימת המשרות. אפשר לשנות הכול בהמשך."
>
</niva-page-heading>
<form
  class="preferences-panel niva-form panel bg-surface rounded-[20px] narrow-panel max-w-[800px]"
  (ngSubmit)="save()"
>
  <div class="panel-heading flex items-center gap-[15px]">
    <span class="round-icon items-center justify-center shrink-[0] blue"
      ><niva-icon name="settings"
    /></span>
    <div>
      <h2>העדפות החיפוש שלך</h2>
      <p>
        {{
          store.isAccount()
            ? 'ההעדפות נשמרות בחשבון וזמינות גם ממכשירים אחרים.'
            : 'בהדגמה ההעדפות נשמרות רק בדפדפן הזה.'
        }}
      </p>
    </div>
  </div>
  <niva-preference-fields
    [accountOwned]="store.isAccount()"
    [value]="draft"
    (valueChange)="draft = $event; saved.set(false)"
  />
  <div class="form-actions flex items-center gap-[22px] flex-wrap max-[768px]:gap-[16px]">
    <button
      class="button inline-flex items-center gap-[13px] rounded-[12px] bg-action text-on-action font-semibold leading-[1.5] enabled:hover:bg-action-hover"
      type="submit"
      [disabled]="saving() || store.busy() || (store.isAccount() && !store.accountReady())"
    >
      {{ saving() ? 'שומרים…' : 'שמירת ההעדפות' }} <niva-icon name="check" />
    </button>
    @if (saved()) {
      <span class="success-text text-success text-[12px]" role="status"
        >ההעדפות נשמרו. {{ store.eligibleJobs().length }} משרות
        {{ store.catalogMode() === 'demo' ? 'לדוגמה' : 'מהמקור' }} מתאימות כעת.</span
      >
    }
  </div>
  <niva-form-status [error]="error()" />
</form>

<div class="theme-control inline-flex">
  <button
    type="button"
    class="theme-icon inline-grid place-items-center rounded-[50%] bg-transparent text-muted hover:bg-pale hover:text-brand"
    [attr.aria-label]="label()"
    [title]="label()"
    (click)="cycle()"
  >
    <svg
      width="22"
      height="22"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.7"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      @switch (theme.preference()) {
        @case ('light') {
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5" />
        }
        @case ('dark') {
          <path d="M20.5 13a8.5 8.5 0 0 1-9.5-9.5A8.5 8.5 0 1 0 20.5 13Z" />
        }
        @default {
          <rect x="3" y="4" width="18" height="13" rx="2" />
          <path d="M8 21h8m-4-4v4" />
        }
      }
    </svg>
  </button>
  @if (theme.notice()) {
    <p class="form-hint flex items-start gap-[6px] text-muted leading-[1.8]" role="status">
      {{ theme.notice() }}
    </p>
  }
</div>
